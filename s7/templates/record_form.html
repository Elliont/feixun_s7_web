{% extends "base.html" %}
{% block title %}补录 · 韭菜称重{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1 class="page-title">补录一次称重</h1>
    <p class="page-sub">用于漏传或线下称重，来源标记为「手动」</p>
  </div>
  <a class="btn btn-ghost" href="/records">← 返回</a>
</div>

<form class="form-card" method="post" action="/records/new">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  {% if err %}<div class="form-error">请检查体重（0–400 kg 之间）</div>{% endif %}

  <div class="form-grid">
    <div class="field">
      <label for="member_id">成员</label>
      <select class="select" id="member_id" name="member_id">
        <option value="0">— 待分配 —</option>
        {% for m in members %}
        <option value="{{ m.id }}" {% if sel == m.id|string %}selected{% endif %}>{{ m.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="field">
      <label for="measured_at">时间</label>
      <input class="input" id="measured_at" name="measured_at" type="datetime-local" value="{{ now }}">
    </div>

    <div class="field">
      <label for="weight">体重</label>
      <input class="input" id="weight" name="weight" type="number" step="0.1" min="1" max="400"
             placeholder="84.5" required>
    </div>

    <div class="field">
      <label for="impedance">阻抗（可选）</label>
      <input class="input" id="impedance" name="impedance" type="number" step="0.1"
             min="100" max="3000" placeholder="例如 420">
      <div class="field-hint">不填则只记录体重；填了会按芯海公式算体成分</div>
    </div>
  </div>

  <div class="form-actions">
    <button class="btn btn-primary" type="submit">保存</button>
    <a class="btn btn-ghost" href="/records">取消</a>
  </div>
</form>
{% endblock %}
